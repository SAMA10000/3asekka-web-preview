name: ChatGPT NAMAA Safety Audio Publish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-namaa-safety-audio-publish.yml'
      - 'tools/chatgpt_namaa_safety_audio.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'gradio_client>=1.4,<2' soundfile numpy
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Generate Egyptian audio with NAMAA
        env:
          HF_SPACE: omarelshehy/NAMAA-Egyptian-Voice
        run: python tools/chatgpt_namaa_safety_audio.py

      - name: Verify outputs
        run: |
          test -s generated/namaa-safety/safety_general.mp3
          test -s generated/namaa-safety/communication_warning.mp3
          test -s generated/namaa-safety/safety_general.wav
          test -s generated/namaa-safety/communication_warning.wav
          ffprobe -v error -show_entries format=duration -of default=nk=1:nw=1 generated/namaa-safety/safety_general.mp3
          ffprobe -v error -show_entries format=duration -of default=nk=1:nw=1 generated/namaa-safety/communication_warning.mp3

      - name: Commit generated audio only
        run: |
          git config user.name 'chatgpt-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add generated/namaa-safety/safety_general.mp3 generated/namaa-safety/communication_warning.mp3 generated/namaa-safety/safety_general.wav generated/namaa-safety/communication_warning.wav
          if git diff --cached --quiet; then
            echo 'Audio outputs already current.'
          else
            git commit -m 'Generate 3ASEKKA NAMAA safety audio'
            git push origin HEAD:main
          fi

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3asekka-namaa-safety-audio
          path: |
            generated/namaa-safety/safety_general.mp3
            generated/namaa-safety/communication_warning.mp3
            generated/namaa-safety/safety_general.wav
            generated/namaa-safety/communication_warning.wav
          retention-days: 7
