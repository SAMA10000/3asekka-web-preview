name: Temporary DB Cooper Assets And Voice
on:
  push:
    branches: [tmp-dbcooper-video]
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate one-piece Aly narration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python3 - <<'PY'
          import json, urllib.request
          text=open('.tmp/dbcooper/script_ar.txt',encoding='utf-8').read()
          payload=json.dumps({'text':text,'speaker':'Aly','speed':1.0,'steps':32,'guidance':2.5}).encode('utf-8')
          req=urllib.request.Request('https://voicetut-bridge.lovable.app/api/public/tts',data=payload,headers={'Content-Type':'application/json','User-Agent':'Mozilla/5.0'},method='POST')
          with urllib.request.urlopen(req,timeout=300) as r:
              data=r.read()
              print('status',r.status,'type',r.headers.get('content-type'),'bytes',len(data))
          if not data.startswith(b'RIFF'):
              print(data[:1000])
              raise SystemExit('VoiceTut did not return WAV')
          open('out/dbcooper_aly.wav','wb').write(data)
          PY
          python3 - <<'PY'
          import wave
          p='out/dbcooper_aly.wav'
          with wave.open(p,'rb') as w:
              print('duration',w.getnframes()/w.getframerate(),'rate',w.getframerate())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dbcooper-voice
          path: out/
          retention-days: 1

  assets:
    runs-on: ubuntu-latest
    steps:
      - name: Download FBI and Commons visuals
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python3 - <<'PY'
          import urllib.request, urllib.parse, json, os, re, time, html
          UA={'User-Agent':'Mozilla/5.0 (compatible; educational-video-builder/1.0)'}
          def get(url,timeout=60):
              req=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(req,timeout=timeout) as r: return r.read()
          def save(url,path):
              try:
                  data=get(url,90)
                  if len(data)<5000: return False
                  open(path,'wb').write(data); print('OK',path,len(data),url); return True
              except Exception as e:
                  print('FAIL',url,e); return False
          # FBI case page: capture official evidence images.
          page=get('https://www.fbi.gov/history/cases-and-criminals/db-cooper-hijacking').decode('utf-8','ignore')
          urls=[]
          for m in re.finditer(r'<img[^>]+(?:src|data-src)=[\"\']([^\"\']+)',page,re.I):
              u=html.unescape(m.group(1))
              if u.startswith('//'): u='https:'+u
              elif u.startswith('/'): u='https://www.fbi.gov'+u
              if u.startswith('http') and any(k in u.lower() for k in ['cooper','db-','d-b','parach','money','tie']): urls.append(u)
          seen=set(); n=0
          for u in urls:
              u=u.split('?')[0]
              if u in seen: continue
              seen.add(u); ext=os.path.splitext(urllib.parse.urlparse(u).path)[1].lower()
              if ext not in ['.jpg','.jpeg','.png','.webp']: ext='.jpg'
              if save(u,f'out/fbi_{n:02d}{ext}'): n+=1
          print('FBI images',n)
          # Commons searches for varied archival B-roll. Download thumbnails to avoid huge files.
          queries=[
            'Boeing 727 Northwest Orient',
            'Boeing 727 cabin interior',
            'Boeing 727 passenger cabin',
            '1970 airport terminal United States',
            'parachute skydiver vintage',
            'parachute equipment vintage',
            'Washington state forest night',
            'Pacific Northwest forest',
            'Columbia River Washington aerial',
            'Columbia River shore',
            'United States twenty dollar bills',
            'FBI agents 1970s',
            'police search forest',
            'rain storm aircraft night',
            'airliner stairs rear Boeing 727',
            'aircraft cockpit 1970s'
          ]
          idx=0
          for q in queries:
              params={
                'action':'query','generator':'search','gsrsearch':q,'gsrnamespace':'6','gsrlimit':'4',
                'prop':'imageinfo','iiprop':'url','iiurlwidth':'1280','format':'json','formatversion':'2'
              }
              api='https://commons.wikimedia.org/w/api.php?'+urllib.parse.urlencode(params)
              try:
                  data=json.loads(get(api).decode('utf-8'))
              except Exception as e:
                  print('SEARCH FAIL',q,e); time.sleep(2); continue
              for p in data.get('query',{}).get('pages',[]):
                  ii=(p.get('imageinfo') or [{}])[0]
                  u=ii.get('thumburl') or ii.get('url')
                  if not u: continue
                  ext=os.path.splitext(urllib.parse.urlparse(u).path)[1].lower().split('?')[0]
                  if ext not in ['.jpg','.jpeg','.png','.webp']: ext='.jpg'
                  if save(u,f'out/com_{idx:02d}{ext}'): idx+=1
                  time.sleep(0.8)
              time.sleep(1.2)
          print('Commons images',idx)
          PY
          file out/* | head -100 || true
      - uses: actions/upload-artifact@v4
        with:
          name: dbcooper-assets
          path: out/
          retention-days: 1
